[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osf-atlas"
version = "0.1.0"
description = "Local collector/parser for the Obsidian Soundfields Atlas"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
osf = "osf_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
